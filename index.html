<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Promociones de TV HD | Mundo DIRECTV</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 14px; background: #090c13; color: white; font-family: Arial, sans-serif; }
    .contenedor { max-width: 460px; margin: auto; background: #171c26; border-radius: 16px; overflow: hidden; }
    header { padding: 30px 24px; text-align: center; background: linear-gradient(140deg, #09223d, #13496c); }
    .marca { color: #23b8f5; font-size: 28px; font-weight: bold; }
    h1 { font-size: 23px; line-height: 1.25; }
    p { font-size: 14px; line-height: 1.5; }
    form { padding: 26px; }
    label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 8px; }
    .campo { margin-bottom: 20px; }
    input[type="text"], input[type="tel"], select { width: 100%; padding: 14px; border: 1px solid #445064; border-radius: 8px; background: #252b36; color: white; font-size: 16px; font-family: Arial, sans-serif; }
    input::placeholder { color: #aeb8c6; }
    select { cursor: pointer; }
    select option { background: #252b36; color: white; }
    .aceptacion { display: flex; align-items: flex-start; gap: 10px; font-size: 13px; font-weight: normal; line-height: 1.5; }
    .aceptacion input { margin-top: 3px; }
    button { width: 100%; margin-top: 20px; padding: 16px; border: none; border-radius: 8px; background: #087fce; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:hover { background: #069de7; }
    button:disabled { opacity: .7; cursor: wait; }
    .aviso { display: none; padding: 14px; background: #29394a; border-radius: 8px; margin-bottom: 18px; font-size: 13px; line-height: 1.5; }
    /* Pantalla final, visible solo cuando Sheets confirma el registro. */
    form.confirmado > :not(#aviso) { display: none !important; }
    form.confirmado { padding: 28px 26px 32px; }
    form.confirmado .aviso {
      display: flex !important; flex-direction: column; align-items: center;
      gap: 12px; padding: 28px 20px; margin: 0;
      background: #103957; border-radius: 12px; text-align: center;
    }
    .exito-icono { color: #61d6a4; font-size: 46px; line-height: 1; }
    .exito-titulo { color: #ffffff; font-size: 23px; font-weight: bold; }
    .exito-texto { color: #d9e7f2; font-size: 15px; line-height: 1.55; }
    body.registro-confirmado header h1,
    body.registro-confirmado header p { display: none; }
    body.registro-confirmado header { padding: 25px 24px; }
    .nota { text-align: center; color: #b9c5d3; font-size: 12px; margin-top: 18px; }
  </style>
</head>
<body>
  <main class="contenedor">
    <header>
      <div class="marca">MUNDO DIRECTV</div>
      <h1>¡Conocé las promociones de TV Digital para tu hogar!</h1>
      <p>Dejanos tus datos y un asesor se va a contactar para informarte sobre los planes disponibles.</p>
    </header>
    <form id="formulario">
      <div id="aviso" class="aviso" role="status" aria-live="polite"></div>
      <div class="campo">
        <label for="nombre">Nombre y apellido</label>
        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre y apellido" autocomplete="name" required>
      </div>
      <div class="campo">
        <label for="telefono">Número de teléfono</label>
        <input type="tel" id="telefono" name="telefono" placeholder="Ej.: 351 300 1234" autocomplete="tel" required>
      </div>
      <div class="campo">
        <label for="localidad">Localidad y provincia</label>
        <input type="text" id="localidad" name="localidad" placeholder="Ej.: Córdoba, Córdoba" required>
      </div>
      <div class="campo">
        <label for="tarjeta">¿Qué tarjeta de crédito tenés?</label>
        <select id="tarjeta" name="tarjeta" required>
          <option value="" disabled selected>Seleccioná tu tarjeta</option>
          <option value="Visa">Visa</option>
          <option value="Mastercard">Mastercard</option>
          <option value="Naranja">Naranja</option>
          <option value="American Express">American Express</option>
          <option value="Nativa">Nativa</option>
        </select>
      </div>
      <label class="aceptacion">
        <input type="checkbox" name="consentimiento" value="si" required>
        <span>Acepto que un asesor me llame para contarme las promociones disponibles.</span>
      </label>
      <p style="font-size:12px; line-height:1.5; margin-top:10px;">
        Tus datos serán utilizados por Cuyocon para gestionar tu consulta.
        Consultá nuestra
        <a href="privacidad.html" target="_blank" rel="noopener noreferrer" style="color:#23b8f5;">Política de Privacidad</a>.
      </p>
      <button type="submit">ENVIAR CONSULTA</button>
    </form>
  </main>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwCm7Uru9e3bycxLESjnXPbDpOpBVqjcG2-QjK-7VoX4rQ4P7ABXegDZ6HBzUMdwER6/exec";
    const formulario = document.getElementById("formulario");
    const aviso = document.getElementById("aviso");
    const boton = formulario.querySelector('button[type="submit"]');

    function mostrarAviso(mensaje) {
      aviso.style.display = "block";
      aviso.textContent = mensaje;
    }

    function esperar(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    // Apps Script permite una respuesta JSONP para consultar únicamente el estado.
    // El código remoto se ejecuta en esta página: usar solo nuestro Apps Script.
    function verificarSolicitud(idSolicitud) {
      return new Promise((resolve, reject) => {
        const callback = "verificarDTV_" + crypto.randomUUID().replace(/-/g, "");
        const etiqueta = document.createElement("script");
        const url = new URL(SCRIPT_URL);
        let finalizado = false;
        let temporizador;

        function terminar(error, estado) {
          if (finalizado) return;
          finalizado = true;
          clearTimeout(temporizador);
          etiqueta.remove();
          delete window[callback];
          if (error) reject(error);
          else resolve(estado);
        }

        window[callback] = respuesta => {
          terminar(null, respuesta && respuesta.estado);
        };

        url.searchParams.set("idSolicitud", idSolicitud);
        url.searchParams.set("callback", callback);
        etiqueta.src = url.toString();
        etiqueta.onerror = () => terminar(new Error("No se pudo consultar el registro"));
        temporizador = setTimeout(() => terminar(new Error("Tiempo de espera agotado")), 10000);
        document.head.appendChild(etiqueta);
      });
    }

    formulario.addEventListener("submit", async function(event) {
      event.preventDefault();
      if (boton.disabled || !formulario.reportValidity()) return;

      if (!SCRIPT_URL.startsWith("https://script.google.com/macros/s/")) {
        mostrarAviso("Falta configurar la conexión del formulario.");
        return;
      }

      boton.disabled = true;
      boton.textContent = "ENVIANDO...";
      mostrarAviso("Estamos registrando tu solicitud...");

      let confirmado = false;
      let envioIntentado = false;

      try {
        const datos = new URLSearchParams();
        const idSolicitud = crypto.randomUUID();
        datos.append("idSolicitud", idSolicitud);
        datos.append("nombre", formulario.elements["nombre"].value.trim());
        datos.append("telefono", formulario.elements["telefono"].value.trim());
        datos.append("localidad", formulario.elements["localidad"].value.trim());
        datos.append("tarjeta", formulario.elements["tarjeta"].value);
        datos.append("consentimiento", formulario.elements["consentimiento"].checked ? "si" : "no");

        // La respuesta POST no es legible con no-cors. La verificación posterior
        // busca el ID en Sheets, sin asumir que fetch confirma el guardado.
        envioIntentado = true;
        await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: datos });

        for (let intento = 0; intento < 5; intento++) {
          await esperar(1500);
          try {
            const estado = await verificarSolicitud(idSolicitud);
            if (estado === "CONFIRMADO") {
              confirmado = true;
              break;
            }
            if (estado === "ERROR" || estado === "INVALIDO") break;
          } catch (errorVerificacion) {
            console.warn("No se pudo verificar el registro:", errorVerificacion);
            // Una consulta fallida no implica que el registro haya fallado.
          }
        }

        if (confirmado) {
          formulario.reset();
          aviso.innerHTML = '<span class="exito-icono" aria-hidden="true">✓</span>' +
            '<span class="exito-titulo">¡Gracias por tu consulta!</span>' +
            '<span class="exito-texto">¡Recibimos tus datos!<br>Un asesor se comunicará con vos en breve para contarte las promociones disponibles.</span>';
          formulario.classList.add("confirmado");
          document.body.classList.add("registro-confirmado");
          window.scrollTo({ top: 0, behavior: "smooth" });
          // Más adelante, el evento Lead de Meta se agregará aquí.
        } else {
          mostrarAviso("No pudimos confirmar la recepción de tu consulta. Puede que se haya registrado. Por favor, no la envíes nuevamente por ahora.");
        }
      } catch (error) {
        console.error("Error durante el envío:", error);
        mostrarAviso(envioIntentado
          ? "No pudimos confirmar el envío. Puede que se haya registrado; por favor, no lo repitas por ahora."
          : "No pudimos iniciar el envío. Por favor, intentá nuevamente.");
      } finally {
        boton.disabled = false;
        boton.textContent = "ENVIAR CONSULTA";
      }
    });
  </script>
</body>
</html>
