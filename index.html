

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Promociones de TV HD | Mundo DIRECTV</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 14px;
      background: #090c13;
      color: white;
      font-family: Arial, sans-serif;
    }

    .contenedor {
      max-width: 460px;
      margin: auto;
      background: #171c26;
      border-radius: 16px;
      overflow: hidden;
    }

    header {
      padding: 30px 24px;
      text-align: center;
      background: linear-gradient(140deg, #09223d, #13496c);
    }

    .marca {
      color: #23b8f5;
      font-size: 28px;
      font-weight: bold;
    }

    h1 {
      font-size: 23px;
      line-height: 1.25;
    }

    p {
      font-size: 14px;
      line-height: 1.5;
    }

    form {
      padding: 26px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .campo {
      margin-bottom: 20px;
    }

    input[type="text"],
    input[type="tel"],
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #445064;
      border-radius: 8px;
      background: #252b36;
      color: white;
      font-size: 16px;
      font-family: Arial, sans-serif;
    }

    input::placeholder {
      color: #aeb8c6;
    }

    select {
      cursor: pointer;
    }

    select option {
      background: #252b36;
      color: white;
    }

    .aceptacion {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 13px;
      font-weight: normal;
      line-height: 1.5;
    }

    .aceptacion input {
      margin-top: 3px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 16px;
      border: none;
      border-radius: 8px;
      background: #087fce;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #069de7;
    }

    .aviso {
      display: none;
      padding: 14px;
      background: #29394a;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 13px;
      line-height: 1.5;
    }

    .nota {
      text-align: center;
      color: #b9c5d3;
      font-size: 12px;
      margin-top: 18px;
    }
  </style>
</head>

<body>

  <main class="contenedor">

    <header>
      <div class="marca">MUNDO DIRECTV</div>

      <h1>
        ¡Conocé las promociones de TV Digital para tu hogar!
      </h1>

      <p>
        Dejanos tus datos y un asesor se va a contactar
        para informarte sobre los planes disponibles.
      </p>
    </header>

    <form id="formulario">

      <div id="aviso" class="aviso" role="status"></div>

      <div class="campo">
        <label for="nombre">
          Nombre y apellido
        </label>

        <input
          type="text"
          id="nombre"
          name="nombre"
          placeholder="Tu nombre y apellido"
          autocomplete="name"
          required
        >
      </div>

      <div class="campo">
        <label for="telefono">
          Número de teléfono
        </label>

        <input
          type="tel"
          id="telefono"
          name="telefono"
          placeholder="Ej.: 351 300 1234"
          autocomplete="tel"
          required
        >
      </div>

      <div class="campo">
        <label for="localidad">
          Localidad y provincia
        </label>

        <input
          type="text"
          id="localidad"
          name="localidad"
          placeholder="Ej.: Córdoba, Córdoba"
          required
        >
      </div>

      <div class="campo">
        <label for="tarjeta">
          ¿Qué tarjeta de crédito tenés?
        </label>

        <select
          id="tarjeta"
          name="tarjeta"
          required
        >
          <option value="" disabled selected>
            Seleccioná tu tarjeta
          </option>

          <option value="Visa">
            Visa
          </option>

          <option value="Mastercard">
            Mastercard
          </option>

          <option value="Naranja">
            Naranja
          </option>

          <option value="American Express">
            American Express
          </option>
        </select>
      </div>

      <label class="aceptacion">
        <input type="checkbox" name="consentimiento" value="si" required>

        <span>
          Acepto que un asesor me llame para contarme las promociones disponibles.
        </span>
      </label>
      <p style="font-size:12px; line-height:1.5; margin-top:10px;">
  Tus datos serán utilizados por Cuyocon
  para gestionar tu consulta.
  Consultá nuestra
  <a href="privacidad.html"
     target="_blank"
     rel="noopener noreferrer"
     style="color:#23b8f5;">
    Política de Privacidad
  </a>.
</p>

      <button type="submit">
        ENVIAR CONSULTA
      </button>

      
     

    </form>

  </main>

 
<script>
  // PEGÁ ACÁ LA URL DE TU APLICACIÓN WEB DE GOOGLE
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwCm7Uru9e3bycxLESjnXPbDpOpBVqjcG2-QjK-7VoX4rQ4P7ABXegDZ6HBzUMdwER6/exec";

  const formulario = document.getElementById("formulario");
  const aviso = document.getElementById("aviso");
  const boton = formulario.querySelector('button[type="submit"]');

  formulario.addEventListener("submit", async function(event) {
    event.preventDefault();

    if (!formulario.reportValidity()) {
      return;
    }

    // Comprobar que la URL esté configurada.
    if (!SCRIPT_URL.startsWith("https://script.google.com/macros/s/")) {
      aviso.style.display = "block";
      aviso.textContent = "Falta configurar la conexión del formulario.";
      return;
    }

    boton.disabled = true;
    boton.textContent = "ENVIANDO...";
    aviso.style.display = "block";
    aviso.textContent = "Estamos registrando tu solicitud...";

    try {
      const datos = new URLSearchParams();

      datos.append("nombre", formulario.elements["nombre"].value.trim());
      datos.append("telefono", formulario.elements["telefono"].value.trim());
      datos.append("localidad", formulario.elements["localidad"].value.trim());
      datos.append("tarjeta", formulario.elements["tarjeta"].value);
      datos.append(
        "consentimiento",
        formulario.elements["consentimiento"].checked ? "si" : "no"
      );

      // Google Apps Script no siempre permite leer la
      // respuesta desde una página alojada en GitHub.
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        body: datos
      });

      // El envío se intentó, pero no podemos confirmar
      // desde el navegador si Google Sheets lo guardó.
      aviso.textContent =
        "Gracias por tu consulta." +
        "Tu solicitud fue enviada para su procesamiento. " +
        "Un asesor se comunicará en breve.";

      // No borramos los datos hasta verificar la conexión.

    } catch (error) {
      aviso.textContent =
        "No pudimos completar el envío. " +
        "Por favor, intentá nuevamente.";

      console.error("Error de envío:", error);

    } finally {
      boton.disabled = false;
      boton.textContent = "QUIERO QUE ME LLAMEN";
    }
  });
</script>


</body>
</html>
